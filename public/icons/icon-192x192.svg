<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="40" fill="#2563eb"/>
  <g transform="translate(96, 96)">
    <!-- Fish body -->
    <ellipse cx="0" cy="0" rx="50" ry="30" fill="white"/>
    <!-- Fish tail -->
    <polygon points="45,-25 70,0 45,25" fill="white"/>
    <!-- Fish eye -->
    <circle cx="-25" cy="-5" r="8" fill="#2563eb"/>
    <circle cx="-23" cy="-7" r="3" fill="white"/>
    <!-- Fish fin -->
    <polygon points="-5,-30 10,-15 -10,-15" fill="white" opacity="0.8"/>
  </g>
</svg>