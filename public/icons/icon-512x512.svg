<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#2563eb"/>
  <g transform="translate(256, 256)">
    <!-- Fish body -->
    <ellipse cx="0" cy="0" rx="130" ry="80" fill="white"/>
    <!-- Fish tail -->
    <polygon points="115,-65 185,0 115,65" fill="white"/>
    <!-- Fish eye -->
    <circle cx="-65" cy="-15" r="22" fill="#2563eb"/>
    <circle cx="-60" cy="-20" r="8" fill="white"/>
    <!-- Fish fin -->
    <polygon points="-15,-80 25,-40 -30,-40" fill="white" opacity="0.8"/>
    <!-- Bottom fin -->
    <polygon points="20,80 50,50 60,80" fill="white" opacity="0.8"/>
  </g>
</svg>